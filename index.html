<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
  <title>Head Judge Arbiter</title>
  <meta name="description" content="Ask any Magic: The Gathering rules question mid-game. The judge checks current Oracle text and the Comprehensive Rules before ruling.">
  <meta name="theme-color" content="#0d1a0d">
  <meta property="og:title" content="Head Judge Arbiter">
  <meta property="og:description" content="A friendly Magic: The Gathering rules judge that checks current Oracle text and the Comprehensive Rules before every ruling.">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://the-ljaw.github.io/head-judge-arbiter/">
  <meta property="og:image" content="https://the-ljaw.github.io/head-judge-arbiter/assets/og.png">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="icon" href="assets/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="assets/icon-180.png">
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Judge">
  <link rel="preload" href="assets/fonts/crimson-pro.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="assets/fonts/cinzel.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="styles.css">
  <script src="config.js"></script>
  <script type="module" src="js/app.js"></script>
</head>
<body>
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs>
      <linearGradient id="g-gold" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="#e8d08a"/><stop offset=".55" stop-color="#c9a84c"/><stop offset="1" stop-color="#8f7330"/>
      </linearGradient>
    </defs>
    <symbol id="i-emblem" viewBox="0 0 64 64">
      <circle cx="32" cy="32" r="29" fill="none" stroke="currentColor" stroke-width="2.2"/>
      <circle cx="32" cy="32" r="24.5" fill="none" stroke="currentColor" stroke-width="1" opacity=".55"/>
      <g stroke="currentColor" stroke-width="1.4" opacity=".7">
        <path d="M32 3v4M32 57v4M3 32h4M57 32h4M11.5 11.5l2.8 2.8M49.7 49.7l2.8 2.8M11.5 52.5l2.8-2.8M49.7 14.3l2.8-2.8"/>
      </g>
      <path d="M32 12.5l5.6 12.3 13.4 1.4-10 9 2.8 13.2L32 41.7l-11.8 6.7 2.8-13.2-10-9 13.4-1.4z" fill="currentColor"/>
    </symbol>
    <symbol id="i-gavel" viewBox="0 0 24 24">
      <g fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
        <path d="M13.2 3.6l5.3 5.3M8.9 7.9l5.3 5.3M11 5.8l5.3 5.3"/>
        <path d="M12.2 4.6l-4.3 4.3 5.3 5.3 4.3-4.3z" fill="currentColor" fill-opacity=".22"/>
        <path d="M12.3 11.6l-7.6 7.6"/>
        <path d="M13 20.5h8"/>
      </g>
    </symbol>
    <symbol id="i-player" viewBox="0 0 24 24">
      <g fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round">
        <circle cx="12" cy="8.2" r="3.7"/><path d="M4.8 20c.8-3.7 3.6-5.8 7.2-5.8s6.4 2.1 7.2 5.8"/>
      </g>
    </symbol>
    <symbol id="i-book" viewBox="0 0 24 24">
      <g fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round" stroke-linecap="round">
        <path d="M12 6.5c-1.9-1.4-4.6-2-8-1.8v13.4c3.4-.2 6.1.4 8 1.8 1.9-1.4 4.6-2 8-1.8V4.7c-3.4-.2-6.1.4-8 1.8z"/><path d="M12 6.5v13.4"/>
      </g>
    </symbol>
    <symbol id="i-history" viewBox="0 0 24 24">
      <g fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
        <path d="M4.5 12a7.5 7.5 0 1 0 2.2-5.3"/><path d="M4.2 4.5v3.4h3.4"/><path d="M12 8v4.3l2.8 1.8"/>
      </g>
    </symbol>
    <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"/></symbol>
    <symbol id="i-send" viewBox="0 0 24 24"><path d="M12 19V6M6.5 11.5L12 6l5.5 5.5" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-stop" viewBox="0 0 24 24"><rect x="7" y="7" width="10" height="10" rx="2" fill="currentColor"/></symbol>
    <symbol id="i-close" viewBox="0 0 24 24"><path d="M6.5 6.5l11 11M17.5 6.5l-11 11" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"/></symbol>
    <symbol id="i-back" viewBox="0 0 24 24"><path d="M14.5 6l-6 6 6 6" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-copy" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"><rect x="8.5" y="8.5" width="11" height="11" rx="2"/><path d="M15.5 8.5V6.5a2 2 0 0 0-2-2h-7a2 2 0 0 0-2 2v7a2 2 0 0 0 2 2h2"/></g></symbol>
    <symbol id="i-share" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 14V4M8 7.5L12 4l4 3.5"/><path d="M7 10.5H6a1.5 1.5 0 0 0-1.5 1.5v6.5A1.5 1.5 0 0 0 6 20h12a1.5 1.5 0 0 0 1.5-1.5V12a1.5 1.5 0 0 0-1.5-1.5h-1"/></g></symbol>
    <symbol id="i-cards" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"><rect x="3.6" y="5.4" width="10" height="14" rx="1.6" transform="rotate(-9 8.6 12.4)"/><rect x="10" y="4.4" width="10" height="14" rx="1.6" transform="rotate(8 15 11.4)" fill="currentColor" fill-opacity=".14"/></g></symbol>
    <symbol id="i-check" viewBox="0 0 24 24"><path d="M5.5 12.5l4.2 4.2 8.8-9.4" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-x-small" viewBox="0 0 24 24"><path d="M8 8l8 8M16 8l-8 8" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></symbol>
    <symbol id="i-flip" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M19.5 9.5A7.5 7.5 0 0 0 6 6.8L4.5 8.3"/><path d="M4.5 4.5v3.8h3.8"/><path d="M4.5 14.5A7.5 7.5 0 0 0 18 17.2l1.5-1.5"/><path d="M19.5 19.5v-3.8h-3.8"/></g></symbol>
    <symbol id="i-search" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="10.5" cy="10.5" r="6"/><path d="M15 15l5 5"/></g></symbol>
    <symbol id="i-external" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M13.5 4.5h6v6M19.5 4.5L11 13"/><path d="M17 14v4.5a1.5 1.5 0 0 1-1.5 1.5h-10A1.5 1.5 0 0 1 4 18.5v-10A1.5 1.5 0 0 1 5.5 7H10"/></g></symbol>
  </svg>

  <div class="app" id="app">
    <header class="masthead" id="masthead">
      <svg class="emblem" aria-hidden="true"><use href="#i-emblem"/></svg>
      <div class="masthead__titles">
        <h1 class="title">Head Judge Arbiter</h1>
        <p class="subtitle">Magic: The Gathering &bull; Rules Oracle</p>
      </div>
      <div class="status" id="status" data-state="checking" role="status">
        <span class="status__dot"></span><span class="status__text">Checking in</span>
      </div>
      <nav class="masthead__tools" aria-label="Tools">
        <button type="button" class="icon-btn" id="btn-rulebook" title="Rulebook" aria-label="Open the rulebook"><svg><use href="#i-book"/></svg></button>
        <button type="button" class="icon-btn" id="btn-history" title="Past rulings" aria-label="Open past rulings"><svg><use href="#i-history"/></svg></button>
        <button type="button" class="icon-btn" id="btn-new" title="New ruling" aria-label="Start a new ruling"><svg><use href="#i-plus"/></svg></button>
      </nav>
    </header>

    <main class="thread" id="thread" tabindex="-1"></main>

    <footer class="composer" id="composer">
      <div class="suggest" id="suggest" role="listbox" aria-label="Card names" hidden></div>
      <form class="composer__form" id="ask-form" autocomplete="off">
        <button type="button" class="composer__card" id="btn-card" title="Name a card" aria-label="Insert a card name"><svg><use href="#i-cards"/></svg></button>
        <label class="visually-hidden" for="question">Your rules question</label>
        <textarea id="question" rows="1" enterkeyhint="send" placeholder="Ask a rules question. Type [[ to name a card." aria-autocomplete="list" aria-controls="suggest"></textarea>
        <button type="submit" class="composer__send" id="btn-send" aria-label="Ask the judge" disabled><svg><use href="#i-send"/></svg></button>
      </form>
      <p class="fineprint" id="fineprint">Based on Magic: The Gathering Comprehensive Rules &bull; Not affiliated with Wizards of the Coast</p>
    </footer>
  </div>

  <div class="scrim" id="scrim" hidden></div>
  <aside class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title" hidden>
    <header class="sheet__head">
      <button type="button" class="icon-btn sheet__back" id="sheet-back" aria-label="Back" hidden><svg><use href="#i-back"/></svg></button>
      <h2 class="sheet__title" id="sheet-title">Rulebook</h2>
      <button type="button" class="icon-btn" id="sheet-close" aria-label="Close"><svg><use href="#i-close"/></svg></button>
    </header>
    <div class="sheet__body" id="sheet-body"></div>
  </aside>

  <div class="card-peek" id="card-peek" aria-hidden="true"><img alt=""></div>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <div class="visually-hidden" id="announcer" aria-live="polite"></div>
  <noscript><p class="noscript">Head Judge Arbiter needs JavaScript to run.</p></noscript>
</body>
</html>
